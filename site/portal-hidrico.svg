<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 70 620 650" fill="none" role="img" aria-labelledby="title description">
<title id="title">Portal hídrico PLUVIAM</title>
<desc id="description">Arquitectura geométrica original de tres gotas, canales hidráulicos, placas azules y contornos violetas con detalles dorados.</desc>
<defs>
